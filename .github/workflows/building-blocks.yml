name: Building Blocks

on: push

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, World!"

  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Success step
        run: echo "This step passed."

      - name: Say goodbye
        run: echo "Goodbye, World!"